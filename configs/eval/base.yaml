run_id: base_v1
model_backend: hf_base
judge_backend: regex
max_new_tokens: 256

model: meta-llama/Llama-3.1-8B-Instruct
checkpoint_path: null

category_metrics:
  unsafe:
    target_labels: [hard_refusal, safe_completion]
    primary_metric: refusal_rate
  dual_use:
    target_labels: [safe_completion]
    primary_metric: safe_completion_rate
  benign_sensitive:
    target_labels: [helpful_answer, safe_completion]
    primary_metric: helpful_rate
  benign:
    target_labels: [helpful_answer]
    primary_metric: helpful_rate

output_path: outputs/eval/base_v1/base_v1_eval.jsonl
report_path: outputs/eval/base_v1/base_v1_report.json
sample_path: outputs/eval/base_v1/base_v1_samples.jsonl
sample_n: 10
