# SafeComp-DPO (dual_use ×2 oversampled) training config — BABEL
#
# Ablation B: tests whether the dual_use safe_completion signal in the
# original safecomp dataset was being drowned by shared-category pairs.
#
# Original safecomp:        dual_use=5004 / shared=5373  (48% / 52%)
# safecomp_dualuse_x2:      dual_use=10008 / shared=5373 (66% / 34%)
#
# Identical hparams to safecomp_babel; only the input dataset changes.
# The expectation is that the dual_use safe_completion preference becomes
# the dominant gradient signal, which should (if the hypothesis is correct)
# strengthen safe_completion behavior on dual_use prompts at eval time.
#
# Usage (BABEL):
#   sbatch scripts/babel_train_dpo.sbatch safecomp_dualuse_x2

regime: safecomp_dualuse_x2
description: "SafeComp-DPO with 2x oversampled dual_use pairs"
model: meta-llama/Llama-3.1-8B-Instruct
backend: trl_dpo

pair_types: []
categories: []

# --- Training hyperparameters (identical to safecomp_babel) ---
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4       # effective batch size = 16
learning_rate: 5.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.1
beta: 0.1
loss_type: sigmoid
max_length: 1024
max_prompt_length: 512
logging_steps: 10
save_strategy: epoch
bf16: true
gradient_checkpointing: true
optim: paged_adamw_8bit

# --- LoRA (PEFT) — identical to safecomp_babel ---
use_lora: true
lora_r: 16
lora_alpha: 16
lora_target_modules: all-linear
lora_dropout: 0.05
modules_to_save:
  - lm_head
  - embed_tokens

# --- 4-bit QLoRA ---
use_4bit: true

# --- Output paths (NEW dir to keep ablations separate) ---
output_dir: outputs/training/safecomp_dualuse_x2_babel
report_path: outputs/training/safecomp_dualuse_x2_babel/training_report.json
checkpoint_dir: outputs/training/safecomp_dualuse_x2_babel/checkpoint
