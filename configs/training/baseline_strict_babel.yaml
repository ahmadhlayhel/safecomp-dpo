# Baseline Refusal-DPO (STRICT) training config — BABEL
#
# Ablation A: stronger baseline objective for dual_use.
#
# Diverges from baseline_babel.yaml ONLY on the dual_use pair signal,
# materialized in hf_data/dpo/baseline_strict_dpo_dataset.jsonl:
#
#   baseline (current):  dual_use → (hard_refusal > unsafe_compliance)
#                        — but the gpt-4o-mini-sourced "unsafe_compliance"
#                          for dual_use is *not actually unsafe*; it's
#                          well-curated helpful analytical content.
#                          The training contrast is therefore weak.
#
#   baseline_strict:     dual_use → (hard_refusal > safe_completion)
#                        — directly trains refusal preference even against
#                          the safest, most professional engagement style.
#                          Sidesteps the broken unsafe_compliance pool.
#
# All other categories and hyperparameters are identical to baseline_babel.
#
# Usage (BABEL):
#   sbatch scripts/babel_train_dpo.sbatch baseline_strict

regime: baseline_strict
description: "Baseline Refusal-DPO (strict): prefers hard refusals over safe completions for dual_use"
model: meta-llama/Llama-3.1-8B-Instruct
backend: trl_dpo

pair_types: []
categories: []

# --- Training hyperparameters (identical to baseline_babel) ---
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4       # effective batch size = 16
learning_rate: 5.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.1
beta: 0.1
loss_type: sigmoid
max_length: 1024
max_prompt_length: 512
logging_steps: 10
save_strategy: epoch
bf16: true
gradient_checkpointing: true
optim: paged_adamw_8bit

# --- LoRA (PEFT) — identical to baseline_babel ---
use_lora: true
lora_r: 16
lora_alpha: 16
lora_target_modules: all-linear
lora_dropout: 0.05
modules_to_save:
  - lm_head
  - embed_tokens

# --- 4-bit QLoRA ---
use_4bit: true

# --- Output paths (NEW dir to keep ablations separate) ---
output_dir: outputs/training/baseline_strict_babel
report_path: outputs/training/baseline_strict_babel/training_report.json
checkpoint_dir: outputs/training/baseline_strict_babel/checkpoint
