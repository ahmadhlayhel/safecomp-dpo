# Pilot generation config — Stage 1
# Small manually-curated run to validate the end-to-end pipeline
# before scaling to full data.

model: meta-llama/Llama-3.1-8B-Instruct
temperature: 0.7
max_new_tokens: 512
batch_size: 4

# Number of prompts to include per category in the pilot set.
pilot_counts:
  unsafe: 5
  dual_use: 5
  benign_sensitive: 5
  benign: 5

# Response types generated at this stage (acceptable responses only).
# unsafe_compliance is excluded: rejected responses are sourced separately,
# not generated alongside acceptable responses.
#
# benign and benign_sensitive both generate helpful_answer only.
# Their rejected sides (hard_refusal) are sourced at the preference-pair
# construction stage, not here.
#
# Open design question (full project): benign prompts may eventually use
# quality pairs (chosen=helpful_answer, rejected=weak_answer) rather than
# refusal pairs.  That requires a separate sourcing strategy and a new
# ResponseType enum value.  Not implemented for the pilot.
expected_response_types:
  unsafe:
    - hard_refusal
    - safe_completion
  dual_use:
    - hard_refusal
    - safe_completion
  benign_sensitive:
    - helpful_answer
  benign:
    - helpful_answer
