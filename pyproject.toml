[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safecomp-dpo"
version = "0.1.0"
description = "Safe-completion DPO research pipeline for Llama 3.1 8B-Instruct"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
generation = [
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
